name = "KappaCheck"
defaultTargets = ["KappaCheck", "PRChecksA", "PRChecksB", "PRChecksC", "SchonhageTensorMatch"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.21.0"

[[lean_lib]]
name = "KappaCheck"

# Certificate arithmetic of open upstream PRs #3-#12 (see formal/open-prs/README.md)
[[lean_lib]]
name = "PRChecksA"

[[lean_lib]]
name = "PRChecksB"

[[lean_lib]]
name = "PRChecksC"

# Certificate arithmetic of PR #226 (bipartite carrier compression)
[[lean_lib]]
name = "SchonhageTensorMatch"
