name: e8-gauge-moment-hosting
on:
  pull_request:
    paths:
      - 'research/e8-gauge-moment-hosting/**'
      - 'research/e8-complex-gauge-kernel/**'
      - 'research/e8-bit-carrier-skeleton/**'
      - 'research/idle-axis-hosting/**'
      - 'research/split-centres-global/**'
      - 'research/e8-early-reset-kernel/**'
      - 'research/e8-early-reset-reuse/**'
      - '.github/workflows/e8-gauge-moment-hosting.yml'
  push:
    paths:
      - 'research/e8-gauge-moment-hosting/**'
      - 'research/e8-complex-gauge-kernel/**'
      - 'research/e8-bit-carrier-skeleton/**'
      - 'research/idle-axis-hosting/**'
      - 'research/split-centres-global/**'
      - 'research/e8-early-reset-kernel/**'
      - 'research/e8-early-reset-reuse/**'
      - '.github/workflows/e8-gauge-moment-hosting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: python -m pip install numpy sympy
      - name: Fresh bit and complex suppliers, packing, and outer certificate
        run: python -B research/e8-gauge-moment-hosting/verify.py "$RUNNER_TEMP/e8-gauge-moment-hosting"
      - name: Require an unchanged tracked tree
        run: git diff --exit-code
