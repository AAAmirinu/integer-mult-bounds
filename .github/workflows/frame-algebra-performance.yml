name: Verify exact frame algebra

on:
  push:
    paths:
      - 'research/frame-algebra-performance/**'
      - '.github/workflows/frame-algebra-performance.yml'
  pull_request:
    paths:
      - 'research/frame-algebra-performance/**'
      - '.github/workflows/frame-algebra-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compare exact rank and RREF on generated matrices and every real frame
        run: python -B research/frame-algebra-performance/test_rows.py -v
      - name: Require committed files to remain unchanged
        run: git diff --exit-code

  full-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install replay dependencies
        run: |
          python -m pip install numpy==2.3.5 mpmath==1.3.0
          if ! test -f /usr/include/boost/multiprecision/cpp_int.hpp; then
            sudo apt-get update
            sudo apt-get install -y libboost-dev
          fi
      - name: Fetch and hash-check the immutable PR364 package
        run: python -B research/frame-algebra-performance/fetch_source.py "$RUNNER_TEMP/frame-algebra-source"
      - name: Reject altered source pins, reused outputs and disabled assertions
        run: python -B research/frame-algebra-performance/check_refusals.py "$RUNNER_TEMP/frame-algebra-source"
      - name: Replay the full original and optimized verifiers sequentially
        run: python -B research/frame-algebra-performance/benchmark.py "$RUNNER_TEMP/frame-algebra-source" "$RUNNER_TEMP/frame-algebra-replay"
      - name: Regenerate the offline corpus from the original full replay
        run: python -B research/frame-algebra-performance/check_fixture.py "$RUNNER_TEMP/frame-algebra-replay/reference-1"
      - name: Require committed files to remain unchanged
        run: git diff --exit-code
