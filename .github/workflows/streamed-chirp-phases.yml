name: streamed-chirp-phases
on:
  pull_request:
    paths:
      - 'research/streamed-chirp-phases/**'
      - 'research/complementary-fft-reservoirs/PROOF.md'
      - 'research/e8-r715-whole-hosted/EXPECTED.json'
      - 'research/e8-r740-replica32/code/engines/outer.py'
      - 'upstream/build/sections/07-resampling.tex'
      - 'upstream/build/sections/08-assembly.tex'
      - '.github/workflows/streamed-chirp-phases.yml'
  push:
    paths:
      - 'research/streamed-chirp-phases/**'
      - 'research/complementary-fft-reservoirs/PROOF.md'
      - 'research/e8-r715-whole-hosted/EXPECTED.json'
      - 'research/e8-r740-replica32/code/engines/outer.py'
      - 'upstream/build/sections/07-resampling.tex'
      - 'upstream/build/sections/08-assembly.tex'
      - '.github/workflows/streamed-chirp-phases.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B research/streamed-chirp-phases/verify.py "$RUNNER_TEMP/streamed-chirp-controls"
      - run: git diff --exit-code
