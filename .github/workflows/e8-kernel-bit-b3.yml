name: e8-kernel-bit-b3

on:
  pull_request:
    paths:
      - 'research/e8-kernel-bit-b3/**'
      - '.github/workflows/e8-kernel-bit-b3.yml'
  push:
    paths:
      - 'research/e8-kernel-bit-b3/**'
      - '.github/workflows/e8-kernel-bit-b3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install a C++17 compiler and Boost headers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libboost-dev
      - name: Quick verification (manifest, pins, stages, legality, B3 columns, banks, guard, kappa)
        run: bash research/e8-kernel-bit-b3/verify.sh --quick "$RUNNER_TEMP/e8b-quick"
      - name: Full verification (adds the #370 five-stage regression)
        run: bash research/e8-kernel-bit-b3/verify.sh "$RUNNER_TEMP/e8b-full"
      - name: Require an unchanged tree
        run: git diff --exit-code
