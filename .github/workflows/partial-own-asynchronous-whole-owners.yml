name: partial-own-asynchronous-whole-owners
on:
  pull_request:
    paths: ['research/partial-own-asynchronous-whole-owners/**', '.github/workflows/partial-own-asynchronous-whole-owners.yml']
  push:
    paths: ['research/partial-own-asynchronous-whole-owners/**', '.github/workflows/partial-own-asynchronous-whole-owners.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - run: python -m pip install numpy sympy
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev g++
      - name: Fresh suppliers, guarded physics and asynchronous composition
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -B research/partial-own-asynchronous-whole-owners/verify.py "$RUNNER_TEMP/partial-own-asynchronous" --boost-include /usr/include
      - name: Require an unchanged tracked tree
        run: git diff --exit-code
