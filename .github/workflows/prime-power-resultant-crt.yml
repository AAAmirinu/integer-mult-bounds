name: Independent prime-power resultant CRT

on:
  pull_request:
    paths:
      - 'research/prime-power-resultant-crt/**'
      - 'research/prime-power-cyclic-inverse/**'
      - '.github/workflows/prime-power-resultant-crt.yml'
  push:
    paths:
      - 'research/prime-power-resultant-crt/**'
      - 'research/prime-power-cyclic-inverse/**'
      - '.github/workflows/prime-power-resultant-crt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # repository baseline pin
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # repository baseline pin
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -I -O research/prime-power-resultant-crt/test_verify.py
      - run: python -B -I -O research/prime-power-resultant-crt/verify.py --output "$RUNNER_TEMP/resultant-crt.json"
      - run: cmp research/prime-power-resultant-crt/RESULTS.json "$RUNNER_TEMP/resultant-crt.json"
      - run: git diff --exit-code
