name: fused-dyadic-halos
on:
  pull_request:
    paths:
      - 'research/fused-dyadic-halos/**'
      - 'references/semantic-bulk/rad20/reports/bulk-resampling-tape-transfer.md'
      - 'references/semantic-bulk/rad20/reports/compact-arbitrary-source-routing.md'
      - 'references/semantic-bulk/rad20/reports/downstream-microbox-resampling.md'
      - 'references/semantic-bulk/rad20/reports/downstream-phase-cell-inverse.md'
      - 'references/semantic-bulk/rad20/reports/review-arbitrary-routing.md'
      - 'references/semantic-bulk/rad20/reports/review-bulk-resampling.md'
      - 'references/semantic-bulk/rad20/reports/review-phase-cell-inverse.md'
      - 'research/batched-gaussian-boundary/PROOF.md'
      - 'upstream/build/sections/07-resampling.tex'
      - '.github/workflows/fused-dyadic-halos.yml'
  push:
    paths:
      - 'research/fused-dyadic-halos/**'
      - 'references/semantic-bulk/rad20/reports/bulk-resampling-tape-transfer.md'
      - 'references/semantic-bulk/rad20/reports/compact-arbitrary-source-routing.md'
      - 'references/semantic-bulk/rad20/reports/downstream-microbox-resampling.md'
      - 'references/semantic-bulk/rad20/reports/downstream-phase-cell-inverse.md'
      - 'references/semantic-bulk/rad20/reports/review-arbitrary-routing.md'
      - 'references/semantic-bulk/rad20/reports/review-bulk-resampling.md'
      - 'references/semantic-bulk/rad20/reports/review-phase-cell-inverse.md'
      - 'research/batched-gaussian-boundary/PROOF.md'
      - 'upstream/build/sections/07-resampling.tex'
      - '.github/workflows/fused-dyadic-halos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B research/fused-dyadic-halos/verify.py "$RUNNER_TEMP/fused-halo-controls"
      - run: git diff --exit-code
