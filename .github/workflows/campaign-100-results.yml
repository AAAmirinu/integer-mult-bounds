name: Verify campaign results archive
on:
  pull_request:
    paths:
      - research/campaign-100-results/**
      - .github/workflows/campaign-100-results.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -B research/campaign-100-results/validate_archive.py
