name: batched-gaussian-boundary
on:
  pull_request:
    paths:
      - 'research/batched-gaussian-boundary/**'
      - 'references/semantic-bulk/rad20/code/downstream_banded_inverse.py'
      - 'references/semantic-bulk/rad20/code/downstream_blocked_gaussian.py'
      - 'references/semantic-bulk/rad20/code/downstream_gaussian.py'
      - 'references/semantic-bulk/rad20/code/downstream_phase_inverse.py'
      - 'references/semantic-bulk/rad20/code/review_banded_inverse.py'
      - 'references/semantic-bulk/rad20/reports/bulk-resampling-tape-transfer.md'
      - 'references/semantic-bulk/rad20/reports/downstream-microbox-resampling.md'
      - 'references/semantic-bulk/rad20/reports/downstream-phase-cell-inverse.md'
      - 'references/semantic-bulk/rad20/reports/review-bulk-resampling.md'
      - 'references/semantic-bulk/rad20/reports/review-phase-cell-inverse.md'
      - 'research/e8-r740-replica32/code/engines/outer.py'
      - 'research/streamed-chirp-phases/PROOF.md'
      - '.github/workflows/batched-gaussian-boundary.yml'
  push:
    paths:
      - 'research/batched-gaussian-boundary/**'
      - 'references/semantic-bulk/rad20/code/downstream_banded_inverse.py'
      - 'references/semantic-bulk/rad20/code/downstream_blocked_gaussian.py'
      - 'references/semantic-bulk/rad20/code/downstream_gaussian.py'
      - 'references/semantic-bulk/rad20/code/downstream_phase_inverse.py'
      - 'references/semantic-bulk/rad20/code/review_banded_inverse.py'
      - 'references/semantic-bulk/rad20/reports/bulk-resampling-tape-transfer.md'
      - 'references/semantic-bulk/rad20/reports/downstream-microbox-resampling.md'
      - 'references/semantic-bulk/rad20/reports/downstream-phase-cell-inverse.md'
      - 'references/semantic-bulk/rad20/reports/review-bulk-resampling.md'
      - 'references/semantic-bulk/rad20/reports/review-phase-cell-inverse.md'
      - 'research/e8-r740-replica32/code/engines/outer.py'
      - 'research/streamed-chirp-phases/PROOF.md'
      - '.github/workflows/batched-gaussian-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B research/batched-gaussian-boundary/verify.py "$RUNNER_TEMP/batched-boundary-controls"
      - run: git diff --exit-code
