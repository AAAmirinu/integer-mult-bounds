name: Verify E8 outer slack refinement
on:
  pull_request:
    paths:
      - 'research/e8-outer-slack-refinement/**'
      - '.github/workflows/e8-outer-slack-refinement.yml'
  push:
    paths:
      - 'research/e8-outer-slack-refinement/**'
      - '.github/workflows/e8-outer-slack-refinement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Replay source and new certificate
        run: python -B research/e8-outer-slack-refinement/verify.py "$RUNNER_TEMP/e8-composed"
      - name: Confirm source tree unchanged
        run: git diff --exit-code
