name: e8-r779-retimed-closure

on:
  pull_request:
    paths:
      - 'research/e8-r779-retimed-closure/**'
      - '.github/workflows/e8-r779-retimed-closure.yml'
  push:
    paths:
      - 'research/e8-r779-retimed-closure/**'
      - '.github/workflows/e8-r779-retimed-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Quick verification (manifest, pins, #424 control, #426 control, promotions, enlargements, sinks, re-synthesis, 124/172 prefixes, 14 retimings, replay, banks, kappa)
        run: bash research/e8-r779-retimed-closure/verify.sh --quick "$RUNNER_TEMP/e8r-quick"
      - name: Full verification (adds every regeneration)
        run: bash research/e8-r779-retimed-closure/verify.sh "$RUNNER_TEMP/e8r-full"
      - name: Require an unchanged tree
        run: git diff --exit-code
