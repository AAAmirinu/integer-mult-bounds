name: E8 replay performance
on:
  pull_request:
    paths:
      - 'research/e8-replay-performance/**'
      - '.github/workflows/e8-replay-performance.yml'
  push:
    paths:
      - 'research/e8-replay-performance/**'
      - '.github/workflows/e8-replay-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - run: python -m pip install -r research/e8-replay-performance/requirements.txt
      - run: python -B research/e8-replay-performance/fetch.py
      - run: python -B research/e8-replay-performance/check.py
      - run: python -B research/e8-replay-performance/replay.py --variant original --output /tmp/e8-original --cxx g++ --boost-include /usr/include
      - run: python -B research/e8-replay-performance/replay.py --variant scalar --output /tmp/e8-fast --cxx g++ --boost-include /usr/include
      - run: python -B research/e8-replay-performance/compare.py /tmp/e8-original /tmp/e8-fast --output /tmp/e8-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e8-replay-evidence
          path: |
            /tmp/e8-comparison.json
            /tmp/e8-original/PACKAGE-RUN.json
            /tmp/e8-original/FAILURE.json
            /tmp/e8-fast/PACKAGE-RUN.json
            /tmp/e8-fast/FAILURE.json
            /tmp/e8-original/logs/
            /tmp/e8-fast/logs/
