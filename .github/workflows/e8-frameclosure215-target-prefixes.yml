name: E8 frameclosure215 target prefixes
on:
  pull_request:
    paths: ['research/e8-frameclosure215-target-prefixes/**', '.github/workflows/e8-frameclosure215-target-prefixes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Verify complete target-prefix composition
        run: python -B research/e8-frameclosure215-target-prefixes/verify.py /tmp/e8-frameclosure215-target-prefixes-proof
