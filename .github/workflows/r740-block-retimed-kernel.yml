name: r740-block-retimed-kernel
on:
  pull_request:
    paths:
      - 'research/r740-block-retimed-kernel/**'
      - '.github/workflows/r740-block-retimed-kernel.yml'
  push:
    paths:
      - 'research/r740-block-retimed-kernel/**'
      - '.github/workflows/r740-block-retimed-kernel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Replay both suppliers and every selected Gaussian phase
        run: python -B research/r740-block-retimed-kernel/verify.py "$RUNNER_TEMP/r740-block-kernel-proof" --replay-phases
      - name: Require an unchanged tracked tree
        run: git diff --exit-code
