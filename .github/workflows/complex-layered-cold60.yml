name: Layered cold60
on:
  pull_request:
    paths:
      - 'research/complex-layered-cold60/**'
      - 'research/complex-layered-cold60-validation/**'
      - '.github/workflows/complex-layered-cold60.yml'
  push:
    branches: ['codex/layered-cold60-20261013']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '${{ matrix.python }}'
      - run: bash research/complex-layered-cold60/verify.sh "${{ runner.temp }}/layered-cold60"
        env:
          LAYERED_COLD60_PYTHON: python
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layered-cold60-python-${{ matrix.python }}
          path: '${{ runner.temp }}/layered-cold60'
